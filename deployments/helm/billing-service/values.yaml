replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: billing-service
  pullPolicy: IfNotPresent
  tag: "latest"

podAnnotations:
  reloader.stakater.com/auto: "true"

podLabels:
  tier: backend

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

ports:
  - name: grpc
    containerPort: 50051
    protocol: TCP
  - name: webhook
    containerPort: 8081
    protocol: TCP

probes:
  readiness:
    path: /health
    port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

app:
  environment: "development"

database:
  host: "host.docker.internal"
  port: "5433"
  name: "notif_db"

kafka:
  brokerAddress: "host.docker.internal:9093"

stripe:
  successUrl: "http://envoy.nirooz.xyz/billing/success?session_id={CHECKOUT_SESSION_ID}"
  cancelUrl: "http://envoy.nirooz.xyz/pricing"

service:
  type: ClusterIP

externalSecret:
  enabled: false
  refreshInterval: "10m"
  secretStore:
    name: "envoy-secret-store"
    kind: "SecretStore"
  key: "prod/billing-service"
